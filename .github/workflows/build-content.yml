name: Build team and recruitment pages
on:
  push:
    branches: [main]
    paths: ['data/site.json', 'scripts/build_content.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-content
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build_content.py
      - name: Save generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html roster.html join.html
          git diff --staged --quiet || git commit -m "chore: regenerate team and recruitment pages"
          git pull --rebase origin main
          git push origin main
